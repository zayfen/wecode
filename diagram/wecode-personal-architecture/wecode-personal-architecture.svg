<svg viewBox="0 0 1280 840" xmlns="http://www.w3.org/2000/svg">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap');
    text {
      font-family: 'JetBrains Mono', 'Noto Sans SC', 'PingFang SC', sans-serif;
    }
    .title { fill: #f8fafc; font-size: 18px; font-weight: 700; }
    .subtitle { fill: #94a3b8; font-size: 10px; font-weight: 400; }
    .region-title { font-size: 10px; font-weight: 600; }
    .name { fill: #ffffff; font-size: 12px; font-weight: 600; text-anchor: middle; }
    .desc { fill: #94a3b8; font-size: 9px; font-weight: 400; text-anchor: middle; }
    .tiny { fill: #cbd5e1; font-size: 8px; font-weight: 400; text-anchor: middle; }
    .label { fill: #e2e8f0; font-size: 8px; font-weight: 500; text-anchor: middle; }
    .note { fill: #fda4af; font-size: 8px; font-weight: 500; }
    .mask { fill: #0f172a; }
    .primary { fill: #083344; fill-opacity: 0.42; stroke: #22d3ee; stroke-width: 1.5; }
    .secondary { fill: #064e3b; fill-opacity: 0.42; stroke: #34d399; stroke-width: 1.5; }
    .tertiary { fill: #4c1d95; fill-opacity: 0.42; stroke: #a78bfa; stroke-width: 1.5; }
    .accent { fill: #78350f; fill-opacity: 0.34; stroke: #fbbf24; stroke-width: 1.5; }
    .alert { fill: #881337; fill-opacity: 0.42; stroke: #fb7185; stroke-width: 1.5; }
    .connector { fill: #7c2d12; fill-opacity: 0.34; stroke: #fb923c; stroke-width: 1.5; }
    .neutral { fill: #1e293b; fill-opacity: 0.52; stroke: #94a3b8; stroke-width: 1.5; }
    .highlight { fill: #1d4ed8; fill-opacity: 0.30; stroke: #60a5fa; stroke-width: 1.5; }
    .arrow { fill: none; stroke: #64748b; stroke-width: 1.6; }
    .arrow-cyan { fill: none; stroke: #22d3ee; stroke-width: 1.8; }
    .arrow-green { fill: none; stroke: #34d399; stroke-width: 1.8; }
    .arrow-orange { fill: none; stroke: #fb923c; stroke-width: 1.8; }
    .arrow-rose { fill: none; stroke: #fb7185; stroke-width: 1.8; }
    .arrow-blue { fill: none; stroke: #60a5fa; stroke-width: 1.8; }
    .dashed { stroke-dasharray: 6 4; opacity: 0.82; }
  </style>

  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <marker id="arrow-cyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#22d3ee"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34d399"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fb923c"/>
    </marker>
    <marker id="arrow-rose" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fb7185"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#60a5fa"/>
    </marker>
    <marker id="arrow-open" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polyline points="0 0, 10 3.5, 0 7" fill="none" stroke="#64748b" stroke-width="1.5"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <text x="40" y="40" class="title">wecode 个人本机架构</text>
  <text x="40" y="60" class="subtitle">Rust 控制层管理 Codex；OpenClaw + 微信插件提供微信消息入口；JSON 配置定义可执行指令和权限。</text>

  <!-- Region boundaries -->
  <rect x="36" y="152" width="190" height="310" rx="12" fill="none" stroke="#94a3b8" stroke-width="1" stroke-dasharray="8 4"/>
  <text x="50" y="172" fill="#94a3b8" class="region-title">外部输入</text>

  <rect x="260" y="92" width="960" height="668" rx="14" fill="none" stroke="#fbbf24" stroke-width="1" stroke-dasharray="12 5"/>
  <text x="278" y="114" fill="#fbbf24" class="region-title">个人电脑 / 本机单用户运行时</text>

  <rect x="294" y="132" width="250" height="500" rx="10" fill="none" stroke="#34d399" stroke-width="1" stroke-dasharray="8 4"/>
  <text x="308" y="152" fill="#34d399" class="region-title">OpenClaw + 微信通道</text>

  <rect x="584" y="132" width="320" height="500" rx="10" fill="none" stroke="#fb923c" stroke-width="1" stroke-dasharray="8 4"/>
  <text x="600" y="152" fill="#fb923c" class="region-title">wecode Rust 控制平面</text>

  <rect x="940" y="132" width="240" height="500" rx="10" fill="none" stroke="#22d3ee" stroke-width="1" stroke-dasharray="8 4"/>
  <text x="956" y="152" fill="#22d3ee" class="region-title">Codex 执行层</text>

  <!-- Connections layer -->
  <path d="M 130 286 L 130 338" class="arrow" marker-end="url(#arrow)"/>
  <text x="156" y="316" class="label">发消息</text>

  <path d="M 190 372 L 318 372" class="arrow-cyan" marker-end="url(#arrow-cyan)"/>
  <text x="254" y="360" class="label">微信会话</text>

  <path d="M 420 346 L 420 318" class="arrow-green" marker-end="url(#arrow-green)"/>
  <text x="464" y="336" class="label">channel events</text>

  <path d="M 515 272 L 620 272" class="arrow-orange" marker-end="url(#arrow-orange)"/>
  <text x="568" y="260" class="label">本机事件桥接</text>
  <path d="M 620 296 L 515 296" class="arrow dashed" marker-end="url(#arrow-open)"/>
  <text x="568" y="314" class="label">回复 / 状态</text>

  <path d="M 740 220 L 740 244" class="arrow-orange" marker-end="url(#arrow-orange)"/>
  <path d="M 740 316 L 740 338" class="arrow-orange" marker-end="url(#arrow-orange)"/>
  <path d="M 740 398 L 740 418" class="arrow-rose" marker-end="url(#arrow-rose)"/>
  <path d="M 740 478 L 740 500" class="arrow-blue" marker-end="url(#arrow-blue)"/>

  <path d="M 860 530 L 930 530 L 930 280 L 970 280" class="arrow-blue" marker-end="url(#arrow-blue)"/>
  <text x="910" y="518" class="label">codex exec --json</text>
  <path d="M 1060 318 L 1060 344" class="arrow-cyan" marker-end="url(#arrow-cyan)"/>
  <path d="M 1060 404 L 1060 464" class="arrow-cyan" marker-end="url(#arrow-cyan)"/>

  <path d="M 445 650 L 445 610 L 642 610 L 642 398" class="arrow dashed" marker-end="url(#arrow-open)"/>
  <text x="524" y="598" class="label">读取 JSON 指令</text>
  <path d="M 665 650 L 665 560" class="arrow dashed" marker-end="url(#arrow-open)"/>
  <text x="690" y="606" class="label">会话映射</text>
  <path d="M 885 650 L 885 284 L 860 284" class="arrow dashed" marker-end="url(#arrow-open)"/>
  <text x="914" y="468" class="label">审计记录</text>
  <path d="M 1075 650 L 1075 530" class="arrow dashed" marker-end="url(#arrow-open)"/>
  <text x="1118" y="596" class="label">本地凭证</text>

  <!-- External components -->
  <rect x="70" y="222" width="120" height="64" rx="6" class="mask"/>
  <rect x="70" y="222" width="120" height="64" rx="6" class="primary"/>
  <text x="130" y="248" class="name">个人微信</text>
  <text x="130" y="265" class="desc">手机 / 桌面端</text>

  <rect x="70" y="340" width="120" height="64" rx="6" class="mask"/>
  <rect x="70" y="340" width="120" height="64" rx="6" class="neutral"/>
  <text x="130" y="366" class="name">微信网络</text>
  <text x="130" y="383" class="desc">扫码登录通道</text>

  <!-- OpenClaw column -->
  <rect x="325" y="166" width="190" height="58" rx="6" class="mask"/>
  <rect x="325" y="166" width="190" height="58" rx="6" class="accent"/>
  <text x="420" y="190" class="name">Node 24 运行时</text>
  <text x="420" y="207" class="desc">npm / npx / openclaw</text>

  <rect x="325" y="246" width="190" height="72" rx="6" class="mask"/>
  <rect x="325" y="246" width="190" height="72" rx="6" class="secondary"/>
  <text x="420" y="274" class="name">OpenClaw Gateway</text>
  <text x="420" y="291" class="desc">本机 daemon / channel hub</text>
  <text x="420" y="305" class="desc">openclaw gateway</text>

  <rect x="318" y="346" width="204" height="72" rx="6" class="mask"/>
  <rect x="318" y="346" width="204" height="72" rx="6" class="primary"/>
  <text x="420" y="374" class="name">openclaw-weixin</text>
  <text x="420" y="391" class="desc">@tencent-weixin 插件</text>
  <text x="420" y="405" class="desc">扫码登录 / 收发消息</text>

  <g transform="translate(342, 478)">
    <rect x="0" y="10" width="156" height="62" rx="2" class="mask"/>
    <ellipse cx="78" cy="10" rx="78" ry="12" class="mask"/>
    <ellipse cx="78" cy="72" rx="78" ry="12" class="mask"/>
    <rect x="0" y="10" width="156" height="62" fill="#4c1d95" fill-opacity="0.42"/>
    <ellipse cx="78" cy="10" rx="78" ry="12" fill="#4c1d95" fill-opacity="0.42" stroke="#a78bfa" stroke-width="1.5"/>
    <ellipse cx="78" cy="72" rx="78" ry="12" fill="#4c1d95" fill-opacity="0.42" stroke="#a78bfa" stroke-width="1.5"/>
    <line x1="0" y1="10" x2="0" y2="72" stroke="#a78bfa" stroke-width="1.5"/>
    <line x1="156" y1="10" x2="156" y2="72" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="78" y="40" class="name">OpenClaw 状态</text>
    <text x="78" y="56" class="desc">账号 / 插件 / 配置</text>
  </g>

  <!-- wecode column -->
  <rect x="620" y="166" width="240" height="58" rx="6" class="mask"/>
  <rect x="620" y="166" width="240" height="58" rx="6" class="primary"/>
  <text x="740" y="190" class="name">wecode CLI</text>
  <text x="740" y="207" class="desc">doctor / install-weixin / config</text>

  <rect x="620" y="246" width="240" height="72" rx="6" class="mask"/>
  <rect x="620" y="246" width="240" height="72" rx="6" class="secondary"/>
  <text x="740" y="274" class="name">wecode daemon</text>
  <text x="740" y="291" class="desc">本机单用户常驻进程</text>
  <text x="740" y="305" class="desc">调度 OpenClaw 与 Codex</text>

  <rect x="620" y="340" width="240" height="58" rx="6" class="mask"/>
  <rect x="620" y="340" width="240" height="58" rx="6" class="connector"/>
  <text x="740" y="364" class="name">指令匹配器</text>
  <text x="740" y="381" class="desc">match / args / template</text>

  <rect x="620" y="420" width="240" height="58" rx="6" class="mask"/>
  <rect x="620" y="420" width="240" height="58" rx="6" class="alert"/>
  <text x="740" y="444" class="name">策略闸门</text>
  <text x="740" y="461" class="desc">allowlist / confirm / sandbox</text>

  <rect x="620" y="502" width="240" height="66" rx="6" class="mask"/>
  <rect x="620" y="502" width="240" height="66" rx="6" class="highlight"/>
  <text x="740" y="529" class="name">Codex 会话管理器</text>
  <text x="740" y="546" class="desc">spawn / resume / timeout / stream</text>

  <!-- Codex column -->
  <rect x="970" y="246" width="180" height="72" rx="6" class="mask"/>
  <rect x="970" y="246" width="180" height="72" rx="6" class="primary"/>
  <text x="1060" y="274" class="name">Codex CLI</text>
  <text x="1060" y="291" class="desc">受控子进程</text>
  <text x="1060" y="305" class="desc">codex exec / resume</text>

  <rect x="970" y="346" width="180" height="58" rx="6" class="mask"/>
  <rect x="970" y="346" width="180" height="58" rx="6" class="highlight"/>
  <text x="1060" y="370" class="name">Codex 会话</text>
  <text x="1060" y="387" class="desc">任务上下文 / JSONL 事件</text>

  <g transform="translate(982, 478)">
    <rect x="0" y="10" width="156" height="62" rx="2" class="mask"/>
    <ellipse cx="78" cy="10" rx="78" ry="12" class="mask"/>
    <ellipse cx="78" cy="72" rx="78" ry="12" class="mask"/>
    <rect x="0" y="10" width="156" height="62" fill="#4c1d95" fill-opacity="0.42"/>
    <ellipse cx="78" cy="10" rx="78" ry="12" fill="#4c1d95" fill-opacity="0.42" stroke="#a78bfa" stroke-width="1.5"/>
    <ellipse cx="78" cy="72" rx="78" ry="12" fill="#4c1d95" fill-opacity="0.42" stroke="#a78bfa" stroke-width="1.5"/>
    <line x1="0" y1="10" x2="0" y2="72" stroke="#a78bfa" stroke-width="1.5"/>
    <line x1="156" y1="10" x2="156" y2="72" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="78" y="40" class="name">工作区 / Git 仓库</text>
    <text x="78" y="56" class="desc">Codex 实际读写目标</text>
  </g>

  <!-- Local stores -->
  <rect x="360" y="650" width="170" height="74" rx="6" class="mask"/>
  <rect x="360" y="650" width="170" height="74" rx="6" class="tertiary"/>
  <text x="445" y="678" class="name">JSON 指令配置</text>
  <text x="445" y="695" class="desc">commands / profiles / schema</text>
  <text x="445" y="709" class="desc">~/.config/wecode/config.json</text>

  <rect x="580" y="650" width="170" height="74" rx="6" class="mask"/>
  <rect x="580" y="650" width="170" height="74" rx="6" class="tertiary"/>
  <text x="665" y="678" class="name">本地状态库</text>
  <text x="665" y="695" class="desc">SQLite 或 JSONL</text>
  <text x="665" y="709" class="desc">会话 / 任务 / 映射</text>

  <rect x="800" y="650" width="170" height="74" rx="6" class="mask"/>
  <rect x="800" y="650" width="170" height="74" rx="6" class="neutral"/>
  <text x="885" y="678" class="name">审计日志</text>
  <text x="885" y="695" class="desc">谁触发了什么</text>
  <text x="885" y="709" class="desc">输入 / 输出 / exit code</text>

  <rect x="1010" y="650" width="130" height="74" rx="6" class="mask"/>
  <rect x="1010" y="650" width="130" height="74" rx="6" class="alert"/>
  <text x="1075" y="678" class="name">本地凭证</text>
  <text x="1075" y="695" class="desc">Codex auth</text>
  <text x="1075" y="709" class="desc">OpenClaw login</text>

  <!-- Security callout -->
  <rect x="48" y="504" width="184" height="90" rx="6" fill="#0f172a" stroke="#fb7185" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="62" y="528" class="note">安全默认值</text>
  <text x="62" y="546" class="note">微信消息是不可信输入。</text>
  <text x="62" y="564" class="note">必须经过策略闸门后，</text>
  <text x="62" y="582" class="note">才能触发 Codex 写入或执行。</text>

  <!-- Legend -->
  <g transform="translate(348, 782)">
    <rect x="0" y="-16" width="590" height="34" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <circle cx="18" cy="1" r="5" fill="#22d3ee"/>
    <text x="62" y="5" class="tiny">用户入口 / Codex</text>
    <circle cx="152" cy="1" r="5" fill="#34d399"/>
    <text x="204" y="5" class="tiny">服务进程</text>
    <circle cx="282" cy="1" r="5" fill="#fb923c"/>
    <text x="340" y="5" class="tiny">桥接 / 指令流</text>
    <circle cx="426" cy="1" r="5" fill="#fb7185"/>
    <text x="492" y="5" class="tiny">安全策略 / 凭证</text>
  </g>
</svg>
